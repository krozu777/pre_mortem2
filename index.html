<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Controlador de Sketches</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<iframe id="mainSketch" src="premortem2.html"></iframe>

<script>
  const iframe = document.getElementById("mainSketch");
  let currentSketch = "premortem2.html";
  let isDead = false;

  // Escucha mensajes del iframe
  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "isDead" && event.data.value === true) {
      isDead = true;
      console.log("isDead recibido. Se detiene todo.");
    }
  });

  // Intervalo de cambio, sólo si isDead es falso
  const interval = setInterval(() => {
    if (!isDead && currentSketch === "premortem2.html") {
      iframe.src = "placa.html";
      currentSketch = "placa.html";
      setTimeout(() => {
        if (!isDead) {
          iframe.src = "premortem2.html";
          currentSketch = "premortem2.html";
        }
      }, 10000); // muestra placa.html por 10 segundos
    } else if (isDead) {
      clearInterval(interval); // detiene el ciclo completamente
    }
  }, 10000);

</script>

</body>
</html>
