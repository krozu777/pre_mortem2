<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Controlador de Sketches</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<iframe id="mainSketch" src="premortem2.html"></iframe>

<script>
  const iframe = document.getElementById("mainSketch");
  let currentSketch = "premortem2.html";

  setInterval(() => {
    if (currentSketch === "premortem2.html") {
      iframe.src = "placa.html";
      currentSketch = "placa.html";
      setTimeout(() => {
        iframe.src = "premortem2.html";
        currentSketch = "premortem2.html";
      }, 10000); // sketch2 se ejecuta 3 segundos
    }
  }, 10000); // cada 10 segundos cambia a sketch2
</script>

</body>
</html>
